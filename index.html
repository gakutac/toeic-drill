<!doctype html>
<html lang="ja"><meta charset="utf-8">
<title>TOEIC 単語ドリル</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#f1f4fa; --line:#e2e7f0;
  --ink:#121a33; --muted:#5e6984; --faint:#9aa3b8;
  --navy:#16255a; --navy2:#2a47a8; --on-navy:#ffffff; --on-navy-muted:rgba(255,255,255,.72); --ring-track:rgba(255,255,255,.16);
  --accent:#ff6a3d; --accent-2:#ff9a3d; --accent-soft:#fff0e9; --accent-ink:#ffffff;
  --blue:#3c6df0; --blue-soft:#e8eefe;
  --good:#12a06a; --good-soft:#e3f6ee; --bad:#e5484d; --bad-soft:#fdeceb; --warn:#e8930c; --warn-soft:#fdf3e1;
  --shadow:0 1px 2px rgba(18,26,51,.04),0 8px 24px rgba(18,26,51,.06);
  --card-border:transparent;
  --en:"Lexend",system-ui,-apple-system,sans-serif;
  --ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --nav-h:66px; --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b1020; --surface:#141b2f; --surface2:#1b2440; --line:#27314d;
  --ink:#eef2fb; --muted:#a7b1ca; --faint:#6f7a96;
  --navy:#1a2a66; --navy2:#2d4cb5;
  --accent:#ff7a4f; --accent-2:#ffab52; --accent-soft:#3a2219; --accent-ink:#1a0d07;
  --blue:#7c9dff; --blue-soft:#1f2b52;
  --good:#3fd394; --good-soft:#123326; --bad:#ff7075; --bad-soft:#3a1a1d; --warn:#ffb547; --warn-soft:#382a12;
  --shadow:none; --card-border:#232c46;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1020; --surface:#141b2f; --surface2:#1b2440; --line:#27314d;
  --ink:#eef2fb; --muted:#a7b1ca; --faint:#6f7a96;
  --navy:#1a2a66; --navy2:#2d4cb5;
  --accent:#ff7a4f; --accent-2:#ffab52; --accent-soft:#3a2219; --accent-ink:#1a0d07;
  --blue:#7c9dff; --blue-soft:#1f2b52;
  --good:#3fd394; --good-soft:#123326; --bad:#ff7075; --bad-soft:#3a1a1d; --warn:#ffb547; --warn-soft:#382a12;
  --shadow:none; --card-border:#232c46;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ja);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:18px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px))}
.en{font-family:var(--en)}
.num{font-family:var(--en);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3;font-weight:700}
h2{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--en);font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px -4px}
.sec-h h3{font-size:16px}
.sec-h span{font-size:12px;color:var(--muted)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--on-navy);
  background:radial-gradient(120% 90% at 100% 0%,var(--navy2) 0%,transparent 60%),linear-gradient(160deg,var(--navy) 0%,#0f1a45 100%)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,61,.28),transparent 70%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.hello{font-size:13px;color:var(--on-navy-muted)}
.hello b{display:block;color:var(--on-navy);font-size:17px;font-weight:700;line-height:1.35}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.12);font-family:var(--en);font-weight:600;font-size:13px;color:var(--on-navy);white-space:nowrap}
.pill svg{width:15px;height:15px}
.pill.fire svg{color:var(--accent-2)}
.hero-body{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:16px;position:relative;z-index:1}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ring .v{font-family:var(--en);font-weight:600;font-variant-numeric:tabular-nums}
.ring .l{font-size:11px;opacity:.75;margin-top:4px}
.ring circle{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.kpis{display:flex;flex-direction:column;gap:10px}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.12)}
.kpi:last-child{border-bottom:0;padding-bottom:0}
.kpi .k{font-size:12px;color:var(--on-navy-muted)}
.kpi .v{font-family:var(--en);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:400;opacity:.7;margin-left:2px}
.hero-msg{position:relative;z-index:1;margin-top:14px;font-size:13.5px;color:var(--on-navy-muted)}
.hero-msg b{color:var(--on-navy)}
.lvbar{position:relative;z-index:1;margin-top:12px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--on-navy-muted)}
.lvbar .track{flex:1;height:6px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.lvbar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.cta{position:relative;z-index:1;margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;min-height:52px;font-weight:700;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px rgba(255,106,61,.35);transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta svg{width:18px;height:18px}

/* ---------- today menu ---------- */
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mi{display:grid;grid-template-columns:44px 1fr auto 16px;gap:12px;align-items:center;padding:14px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--line);width:100%}
.mi:first-child{border-top:0}
.mi:hover{background:var(--surface2)}
.mi[disabled]{opacity:.5;cursor:default}
.ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--c-soft,var(--blue-soft));color:var(--c,var(--blue))}
.ico svg{width:22px;height:22px}
.mi .t{font-weight:700;font-size:15px;line-height:1.35}
.mi .d{font-size:12px;color:var(--muted);line-height:1.45}
.mi .cnt{font-family:var(--en);font-weight:600;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--c-soft,var(--surface2));color:var(--c,var(--muted));white-space:nowrap}
.mi .cnt.done{background:var(--good-soft);color:var(--good)}
.chev{color:var(--faint);width:16px;height:16px}

/* ---------- week chart ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;position:relative;margin-top:6px}
.week .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--line);pointer-events:none}
.week .goal span{position:absolute;right:0;top:-18px;font-size:10.5px;color:var(--faint);font-family:var(--en)}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.day .col{width:100%;max-width:30px;border-radius:9px 9px 5px 5px;background:var(--blue-soft);min-height:4px;position:relative}
.day .col.hit{background:var(--blue)}
.day.today .col{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.day .n{font-family:var(--en);font-size:10.5px;color:var(--muted);height:14px}
.day .wd{font-size:11px;color:var(--faint)}
.day.today .wd{color:var(--accent);font-weight:700}

/* ---------- mastery ---------- */
.master-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigpct{font-family:var(--en);font-weight:600;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.bigpct small{font-size:16px;color:var(--muted);font-weight:400}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c);vertical-align:1px}
.legend b{font-family:var(--en);font-weight:600;color:var(--ink);margin-left:3px}

/* ---------- weak points ---------- */
.wp{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.wp:first-of-type{border-top:0;padding-top:0}
.wp .name{font-weight:700;font-size:14.5px}
.wp .sub{font-size:12px;color:var(--muted)}
.btn-s{border:0;border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.placeholder{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}

/* ---------- mode tiles (問題タブ) ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;min-height:132px;transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode:active{transform:scale(.98)}
.mode .ico{width:40px;height:40px;border-radius:12px}
.mode .t{font-weight:700;font-size:15.5px}
.mode .d{font-size:12px;color:var(--muted);line-height:1.5}
.mode .n{margin-top:auto;font-family:var(--en);font-weight:600;font-size:12px;color:var(--accent)}
.mode.primary{grid-column:1/-1;min-height:0;color:var(--on-navy);background:linear-gradient(150deg,var(--navy),var(--navy2));border-color:transparent}
.mode.primary .d,.mode.primary .n{color:var(--on-navy-muted)}

/* ---------- common controls ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 16px;font-weight:700;min-height:50px}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px rgba(255,106,61,.28)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px;font-weight:500;min-height:40px}
.btn.block{width:100%}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{display:flex;flex-direction:column;align-items:center;line-height:1.3;padding-block:10px;border-width:1.5px}
.grade .btn small{font-size:11px;color:var(--muted);font-family:var(--en);font-weight:400}
.g-again{border-color:var(--bad)!important;color:var(--bad)}
.g-hard{border-color:var(--warn)!important;color:var(--warn)}
.g-good{border-color:var(--good)!important;color:var(--good)}

/* session header */
.sess{display:flex;align-items:center;gap:10px}
.sess .bar{flex:1;height:8px}
.sess .bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s}
.sess .num{font-size:13px}

/* flash card */
.flash{min-height:320px;display:flex;flex-direction:column;gap:14px;cursor:pointer;border-radius:24px}
.word{font-family:var(--en);font-weight:600;font-size:clamp(30px,8vw,42px);letter-spacing:-.01em;line-height:1.15;word-break:break-word}
.pos{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;margin-right:6px;vertical-align:2px}
.meaning{font-size:19px;font-weight:700}
.ex{border-left:3px solid var(--accent);padding-left:12px;background:var(--surface2);border-radius:0 12px 12px 0;padding-block:8px;padding-right:10px}
.ex .e{font-family:var(--en);font-size:15px}
.ex .e mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px}
.ex .j{font-size:13px;color:var(--muted)}
.hint{margin-top:auto;text-align:center;color:var(--faint);font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{background:var(--surface2);border-radius:8px;padding:2px 8px;font-size:11.5px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;border:0;background:var(--blue-soft);color:var(--blue);flex:none}
.icon-btn svg{width:20px;height:20px}

/* quiz (answer-sheet bubbles) */
.stem{font-family:var(--en);font-size:18px;line-height:1.65}
.stem .blank{display:inline-block;min-width:88px;border-bottom:2px solid var(--ink);margin:0 2px;text-align:center;color:var(--accent);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px;transition:border-color .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .bub{flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:600;font-size:13px;color:var(--muted)}
.opt .tx{font-size:16px}
.opt.en-opt .tx{font-family:var(--en)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.explain{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

/* list */
.search{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.list{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .w{font-family:var(--en);font-weight:600}
.li .m{font-size:13px;color:var(--muted);line-height:1.45}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--line))}
.li .cnt{font-family:var(--en);font-size:12px;color:var(--bad)}
.more{padding:12px;text-align:center}

/* result */
.result{align-items:center;text-align:center;gap:8px;padding-block:26px}
.result h2{font-size:24px}
.xp{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-family:var(--en);font-weight:600;font-size:14px}
.big{font-family:var(--en);font-size:56px;line-height:1}

/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
select{font:inherit;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.danger{color:var(--bad);border-color:var(--bad)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(18,26,51,.14)}
nav.tabs button{border:0;background:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted);transition:background .15s,color .15s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}

.empty{text-align:center;padding:32px 16px;color:var(--muted)}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .22s ease-out}
@keyframes burst{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.burst{animation:burst .5s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:340px){.hero-body{grid-template-columns:1fr;justify-items:center}.kpis{width:100%}}
.day .wd{height:17px;line-height:17px}

/* ---------- accounts ---------- */
body.locked nav.tabs{display:none}
.auth{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:12px}
.auth-brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(150deg,var(--navy),var(--navy2))}
.logo svg{width:26px;height:26px}
.brand{font-family:var(--en);font-weight:700;font-size:21px;letter-spacing:-.01em}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.ut{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);transition:transform .15s}
.ut:hover{transform:translateY(-2px)}
.ut .n{font-weight:700}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;line-height:1}
.lbl{font-size:13px;font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:700}
.pill.me{border:0;padding:0 2px;background:transparent}
.tgt{position:relative;z-index:1;display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--on-navy-muted)}
.tgt b{color:var(--on-navy);font-size:15px}
.btn[disabled]{opacity:.55;cursor:default}
</style>

<main class="wrap" id="app"></main>

肢の単語", "id": "infer"}, {"word": "invite", "pos": ["動"], "meaning": "（~するよう）求める、招待する", "level": null, "page": 92, "img": "IMG_9116", "ex": "Customers are invited to share their opinions by completing a short online survey.", "exJa": "お客様には短いオンライン調査にご回答いただき、ご意見をお寄せいただくようお願いしています。", "q": {"stem": "All staff members are ------- to submit ideas for the company's anniversary celebration.", "choices": ["invitation", "invited", "inviting", "invite"], "answer": 1, "explain": "be invited to doで「~するよう求められている」。受動態なので過去分詞invitedが正解。invitationは名詞。"}, "sec": "設問・選択肢の単語", "id": "invite"}, {"word": "mainly", "pos": ["副"], "meaning": "主に", "level": null, "page": null, "img": "IMG_9117", "ex": "Our new branch office will mainly serve corporate clients in the downtown area.", "exJa": "新しい支店は主に中心街の法人顧客に対応する予定です。", "q": {"stem": "The workshop is ------- intended for employees who have joined the company within the past year.", "choices": ["main", "maintain", "mainly", "mainstream"], "answer": 2, "explain": "形容詞 intended を修飾するので副詞 mainly（主に）が正解。main は形容詞で動詞・形容詞を修飾できない。"}, "sec": "設問・選択肢の単語", "id": "mainly"}, {"word": "mention", "pos": ["動"], "meaning": "述べる、言及する", "level": null, "page": null, "img": "IMG_9117", "ex": "During the meeting, the manager mentioned that the office would close early on Friday.", "exJa": "会議中、部長は金曜日にオフィスが早く閉まると述べた。", "q": {"stem": "Please be sure to ------- your reservation number when you call the hotel's front desk.", "choices": ["mention", "attend", "arrive", "respond"], "answer": 0, "explain": "目的語 your reservation number を取り「予約番号を伝える」となる mention が正解。respond は自動詞で to が必要。"}, "sec": "設問・選択肢の単語", "id": "mention"}, {"word": "most likely", "pos": ["句"], "meaning": "おそらく、たぶん", "level": null, "page": null, "img": "IMG_9117", "ex": "The delayed shipment will most likely arrive at our warehouse by Thursday afternoon.", "exJa": "遅れている荷物はおそらく木曜日の午後までに倉庫に届くでしょう。", "q": {"stem": "Because of the heavy rain, the outdoor concert will ------- be postponed until next weekend.  "空所の後ろは主語のない節（will replace...）なので、主格のwhoが入る。whomは目的格で主語になれない。"}, {"stem": "Could you check ------- is responsible for ordering office supplies this month?", "choices": ["who", "whom", "where", "why"], "answer": 0, "explain": "is responsible...の主語が欠けており、人を指すので主格whoが正解。where・whyは副詞の働きで主語になれない。"}, {"stem": "The survey asks ------- in each household usually does the grocery shopping.", "choices": ["why", "whom", "how", "who"], "answer": 3, "explain": "does the grocery shoppingの主語が抜けているので主格の疑問詞whoを選ぶ。how・whyの後ろには完全な文が続く。"}]}, {"src": "Q104", "part": 5, "cat": "語彙", "point": "数詞の後ろに置いて「期間」を表す名詞を、文意に合わせて選ぶ。", "items": [{"stem": "The museum's special exhibit will run for three ------- before moving to another city.", "choices": ["weeks", "wages", "remarks", "errands"], "answer": 0, "explain": "run for three weeks で「3週間開催される」。wages（賃金）やerrands（用事）は期間を表さない。"}, {"stem": "Our warranty covers repairs for two ------- from the date of purchase.", "choices": ["rates", "months", "stocks", "votes"], "answer": 1, "explain": "保証期間を表すのでfor two months（2か月間）が正解。他は期間の意味を持たない。"}, {"stem": "The orientation lasts only a -------, so new hires can begin their regular duties by Wednesday.", "choices": ["fee", "rule", "day", "cost"], "answer": 2, "explain": "lasts only a day で「1日だけで終わる」。lastは期間と結びつくので時間を表すdayを選ぶ。"}]}, {"src": "Q105", "part": 5, "cat": "品詞", "point": "名詞の前に置いて複合名詞をつくる-ing形の名詞（例：parking lot）を選ぶ。", "items": [{"stem": "Visitors should leave their cars in the ------- area behind the library.", "choices": ["parked", "parking", "parks", "parkable"], "answer": 1, "explain": "parking area で「駐車場」という複合名詞。parkedでは「駐車された区域」となり意味が通らない。"}, {"stem": "The ------- instructions are printed on the back of the fabric label.", "choices": ["washer", "washed", "washing", "washable"], "answer": 2, "explain": "washing instructions で「洗濯表示・洗い方の説明」。washableは衣類自体を修飾する形容詞で、instructionsには合わない。"}, {"stem": "Please send the signed form to our ------- office by the end of the month.", "choices": ["billing", "billed", "bills", "biller"], "answer": 0, "explain": "billing office で「請求担当部署」という複合名詞。billedは「請求された」の意味で部署名にならない。"}]}, {"src": "Q106", "part": 5, "cat": "前置詞・接続詞", "point": "場所の位置関係を表す前置詞を文意から選ぶ（～の向かいに・～のそばに・～の周りに）。", "items": [{"stem": "A new bakery has opened directly ------- the post office on Main Street.", "choices": ["opposite", "while", "although", "since"], "answer": 0, "explain": "opposite は前置詞で「～の向かいに」。while・althoughは接続詞で名詞の前に置けず、sinceは時を表す。"}, {"stem": "Bicycle racks are available ------- the east entrance of the gym.", "choices": ["unless", "beside", "whereas", "until"], "answer": 1, "explain": "beside the east entrance で「東口のそばに」。unless・whereasは接続詞、untilは時を表す前置詞。"}, {"stem": "Several benches have been placed ------- the fountain in the town square.", "choices": ["whether", "despite", "around", "because"], "answer": 2, "explain": "around the fountain で「噴水の周りに」。despiteは譲歩、whether・becauseは接続詞で場所を表さない。"}]}, {"src": "Q107", "part": 5, "cat": "品詞", "point": "助動詞have/hasと過去分詞の間には、動詞を修飾する副詞が入る。", "items": [{"stem": "The library has ------- expanded its collection of foreign-language books.", "choices": ["substantial", "substance", "substantially", "substantiate"], "answer": 2, "explain": "has と過去分詞expandedの間で動詞を修飾するのは副詞substantially（大幅に）。"}, {"stem": "Our team has ------- completed the first phase of the software upgrade.", "choices": ["success", "successful", "succeed", "successfully"], "answer": 3, "explain": "現在完了has completedの間に入り動詞を修飾するので副詞successfullyが正解。"}, {"stem": "Ticket prices have ------- remained the same for the past five years.", "choices": ["largely", "large", "larger", "largeness"], "answer": 0, "explain": "have remainedの間に入る副詞largely（おおむね）を選ぶ。large・largerは形容詞、largenessは名詞。"}]}, {"src": "Q108", "part": 5, "cat": "比較・数量", "point": "後ろの名詞が単数か複数かを見て、合う数量詞を選ぶ（all・severalは複数名詞、everyは単数名詞と使う）。", "items": [{"stem": "------- participants in the walking tour should bring comfortable shoes.", "choices": ["Much", "Another", "All", "Either"], "answer": 2, "explain": "participantsは複数形なのでAllが合う。Muchは不可算名詞、Another・Eitherは単数名詞と使う。"}, {"stem": "------- page of the lease agreement must be initialed by the tenant.", "choices": ["Many", "Every", "Several", "Both"], "answer": 1, "explain": "pageは単数形なのでEveryを選ぶ。Many・Several・Bothは複数名詞と結びつく。"}, {"stem": "The coordinator thanked ------- volunteers for helping at the festival.", "choices": ["much", "either", "another", "several"], "answer": 3, "explain": "volunteersは複数形なのでseveral（いくつかの）が正解。much・either・anotherは複数名詞を修飾できない。"}]}, {"src": "Q109", "part": 5, "cat": "語彙", "point": "時制に合う時の副詞を選ぶ（未来ならshortly、過去や現在完了ならrecently・justなど）。", "items": [{"stem": "The winners of the photo contest will be announced -------.", "choices": ["lately", "shortly", "formerly", "ago"], "answer": 1, "explain": "will be announcedと未来の文なのでshortly（まもなく）。lately・formerlyは過去や完了と、agoは過去形と使う。"}, {"stem": "The café on Elm Street ------- reopened after a two-month renovation.", "choices": ["tomorrow", "yet", "recently", "forward"], "answer": 2, "explain": "過去形reopenedを修飾し「最近再開した」となるrecentlyが正解。tomorrowは未来を表し過去形と合わない。"}, {"stem": "The new printer has ------- been installed, so you can use it now.", "choices": ["tomorrow", "next", "ago", "just"], "answer": 3, "explain": "現在完了has been installedの間に入り「ちょうど～したところ」を表すjustを選ぶ。agoは現在完了と使えない。"}]}, {"src": "Q110", "part": 5, "cat": "前置詞・接続詞", "point": "節と節を「しかし」の意味でつなぐ等位接続詞（but / yet）を選ぶ。前置詞や接続副詞では節をつなげない。", "items": [{"stem": "The bookstore closes early on Sundays, ------- its online shop is open around the clock.", "choices": ["instead of", "yet", "in spite of", "as if"], "answer": 1, "explain": "後ろに主語＋動詞が続き、前の節と対比しているので等位接続詞yet（しかし）。instead of・in spite ofは前置詞句で節を導けない。"}, {"stem": "The seminar was free to attend, ------- only a few employees signed up.", "choices": ["notwithstanding", "unlike", "but", "because of"], "answer": 2, "explain": "「無料だったが参加者は少なかった」という逆接で、節をつなぐbutが正解。unlike・because ofは名詞しか続かない。"}, {"stem": "The hotel room was small, ------- it was clean and comfortable.", "choices": ["however", "owing to", "despite", "yet"], "answer": 3, "explain": "節と節を逆接でつなぐ等位接続詞yetを選ぶ。howeverは副詞なのでカンマだけで2つの節をつなげない。"}]}, {"src": "Q111", "part": 5, "cat": "動詞の形", "point": "文に述語動詞がないので述語になる形を選び、next spring などの語句から未来を表す形を判断する。", "items": [{"stem": "The recently hired chef ------- a new seasonal menu next spring.", "choices": ["introducing", "will introduce", "to introduce", "have introduced"], "answer": 1, "explain": "文に述語動詞がなく、next springとあるので未来形will introduceが正解。have introducedは主語と数が合わない。"}, {"stem": "Beginning in October, the gym ------- its opening hours on weekdays.", "choices": ["to extend", "extending", "will extend", "having extended"], "answer": 2, "explain": "述語動詞が必要で、Beginning in Octoberは今後の予定なのでwill extendを選ぶ。to不定詞や-ing形は述語にならない。"}, {"stem": "Mr. Ortega ------- the branch while Ms. Lee is on leave next month.", "choices": ["will oversee", "overseeing", "to oversee", "have overseen"], "answer": 0, "explain": "述語動詞が欠けており、next monthの予定なので未来形will overseeが正解。"}]}, {"src": "Q112", "part": 5, "cat": "慣用表現", "point": "空所後のwithと結びつく形容詞を選ぶ（be compatible with / be pleased with など）。", "items": [{"stem": "Please make sure your laptop is ------- with the projector before the presentation.", "choices": ["eligible", "compatible", "capable", "responsible"], "answer": 1, "explain": "be compatible with で「～と互換性がある」。eligibleはfor、capableはof、responsibleはforと結びつく。"}, {"stem": "Most guests were ------- with the quality of the breakfast buffet.", "choices": ["fond", "keen", "eager", "pleased"], "answer": 3, "explain": "be pleased with で「～に満足している」。fondはof、keen・eagerはto doやonなどと結びつく。"}, {"stem": "Ms. Hart is ------- with several suppliers in the region because of her previous job.", "choices": ["acquainted", "aware", "capable", "dependent"], "answer": 0, "explain": "be acquainted with で「～と知り合いである」。awareはof、capableはof、dependentはonと使う。"}]}, {"src": "Q113", "part": 5, "cat": "品詞", "point": "any の後ろで動詞や前置詞の目的語になる位置には名詞（可算名詞なら複数形）が入る。", "items": [{"stem": "Please contact Ms. Ruiz if you have any ------- about the new parking policy.", "choices": ["concerned", "concerns", "concerning", "concernedly"], "answer": 1, "explain": "have anyの後ろなので名詞concerns（懸念）が入る。可算名詞なので複数形になる。"}, {"stem": "The landlord will not make any ------- to the building until spring.", "choices": ["alter", "altered", "alterations", "alterable"], "answer": 2, "explain": "make any alterations で「何らかの改修を行う」。anyの後ろは名詞なのでalterationsが正解。"}, {"stem": "Customers can request any ------- they need by calling our service desk.", "choices": ["adjustments", "adjust", "adjusted", "adjustable"], "answer": 0, "explain": "requestの目的語でanyの後ろなので名詞adjustments（調整）を選ぶ。adjustableは形容詞。"}]}, {"src": "Q114", "part": 5, "cat": "語彙", "point": "逆接（but / even though / although）の対比から、「一度も～ない・めったに～ない」という否定的な意味の副詞を選ぶ。", "items": [{"stem": "Ms. Grant had ------- used a 3D printer, but she produced a working prototype in her first week.", "choices": ["often", "yet", "never", "soon"], "answer": 2, "explain": "butの後ろの「初週で試作品を完成させた」と対比し「一度も使ったことがなかった」となるneverが正解。"}, {"stem": "Even though the bakery ------- advertises, it is crowded every morning.", "choices": ["heavily", "frequently", "rarely", "ever"], "answer": 2, "explain": "「めったに広告しないのに毎朝混んでいる」という対比になるrarelyを選ぶ。heavily・frequentlyでは譲歩の意味が成り立たない。"}, {"stem": "Although Ms. Diaz ------- takes vacations, she plans to travel abroad this summer.", "choices": ["always", "usually", "also", "seldom"], "answer": 3, "explain": "「めったに休暇を取らないが、今夏は海外旅行を計画している」という対比でseldomが正解。"}]}, {"src": "Q115", "part": 5, "cat": "代名詞・関係詞", "point": "文意と語法から否定の代名詞を選ぶ（人ならnobody、物事ならnothing、of～を続けるならnone）。", "items": [{"stem": "------- in the accounting team noticed the error until the auditors arrived.", "choices": ["Never", "Nobody", "Neither", "Nor"], "answer": 1, "explain": "文の主語で人を表すのでNobody（誰も～ない）。Neverは副詞、Norは接続詞で主語になれない。"}, {"stem": "The inspector found ------- wrong with the building's wiring.", "choices": ["nobody", "never", "neither", "nothing"], "answer": 3, "explain": "find nothing wrong with ～で「～に何も問題がない」。配線について述べるので物事を表すnothingが正解。"}, {"stem": "------- of the forty applicants had experience with the design software.", "choices": ["None", "Nobody", "Never", "Not"], "answer": 0, "explain": "後ろにof＋複数名詞が続くのでNone of（～のうち誰も…ない）。Nobodyはofを続けて使わない。"}]}, {"src": "Q116", "part": 5, "cat": "語彙", "point": "数量・金額・距離などを目的語にとり「見積もる・測る・算出する」を表す動詞を選ぶ。", "items": [{"stem": "The contractor will ------- the cost of repairing the roof before starting work.", "choices": ["arise", "reply", "estimate", "insist"], "answer": 2, "explain": "the cost（費用）を目的語にとり「見積もる」を表すestimateが正解。arise・reply・insistは他動詞として費用を目的語にとらない。"}, {"stem": "Fitness trackers ------- the distance a runner covers during each workout.", "choices": ["belong", "measure", "occur", "consist"], "answer": 1, "explain": "the distance（距離）を目的語にとり「測定する」のはmeasure。他の語は自動詞。"}, {"stem": "The event planner needs to ------- how many guests will require vegetarian meals.", "choices": ["determine", "happen", "rely", "differ"], "answer": 0, "explain": "how many～（人数）を目的語にとり「確定する・算出する」を表すdetermineを選ぶ。"}]}, {"src": "Q117", "part": 5, "cat": "品詞", "point": "be動詞・stay・proveなどの後ろで、主語の状態を表す補語には形容詞が入る。", "items": [{"stem": "The instructions for assembling the shelf were not very -------.", "choices": ["clarity", "clarify", "clear", "clearly"], "answer": 2, "explain": "be動詞の補語でveryに修飾されるので形容詞clear（わかりやすい）が入る。clarityは名詞、clearlyは副詞。"}, {"stem": "The new online booking system has proven extremely ------- to small businesses.", "choices": ["use", "useful", "usefully", "usefulness"], "answer": 1, "explain": "prove＋形容詞で「～だとわかる」。extremelyに修飾される補語なので形容詞usefulが正解。"}, {"stem": "Prices at the farmers market stayed ------- throughout the summer.", "choices": ["stability", "stabilize", "stably", "stable"], "answer": 3, "explain": "stay＋形容詞で「～のままである」。主語の状態を表すので形容詞stableを選ぶ。"}]}, {"src": "Q118", "part": 5, "cat": "語彙", "point": "催しや活動が行われる「場所・会場」を表す名詞を文脈から選ぶ。", "items": [{"stem": "The riverside park has become a favorite ------- for summer music festivals.", "choices": ["duty", "method", "spot", "fee"], "answer": 2, "explain": "音楽祭が行われる「場所」を表すspotが正解。duty（義務）やmethod（方法）は文意に合わない。"}, {"stem": "The ------- for this year's awards ceremony has not been announced yet.", "choices": ["location", "reason", "profit", "attitude"], "answer": 0, "explain": "授賞式の「開催場所」がまだ発表されていないという文意でlocationを選ぶ。"}, {"stem": "Our community center offers several ------- where local clubs can hold their gatherings.", "choices": ["habits", "rooms", "prices", "excuses"], "answer": 1, "explain": "関係副詞whereが続き、集まりを開ける「部屋」を表すroomsが正解。"}]}, {"src": "Q119", "part": 5, "cat": "動詞の形", "point": "前置詞（to・for・byなど）の後ろには動名詞（-ing形）が入る。", "items": [{"stem": "The company is committed to ------- waste in all of its factories.", "choices": ["reduce", "reduced", "reducing", "reduces"], "answer": 2, "explain": "be committed toのtoは前置詞なので、後ろは動名詞reducingになる。"}, {"stem": "Thank you for ------- the time to complete our customer survey.", "choices": ["take", "taking", "taken", "takes"], "answer": 1, "explain": "前置詞forの後ろなので動名詞takingが正解。take the time to doで「時間を割いて～する」。"}, {"stem": "Mr. Okafor improved his presentation skills by ------- a public speaking class.", "choices": ["attend", "attends", "attended", "attending"], "answer": 3, "explain": "by＋動名詞で「～することによって」。前置詞の後ろなのでattendingを選ぶ。"}]}, {"src": "Q120", "part": 5, "cat": "前置詞・接続詞", "point": "「～を除いて」という除外の意味を表す前置詞（except / excluding / other than）を選ぶ。", "items": [{"stem": "The gift shop is open every day ------- national holidays.", "choices": ["except", "toward", "among", "beneath"], "answer": 0, "explain": "「祝日を除いて毎日営業」となる除外のexceptが正解。toward・beneathは方向や位置を表す。"}, {"stem": "All the rooms on the third floor, ------- the storage closet, have been repainted.", "choices": ["beneath", "excluding", "toward", "among"], "answer": 1, "explain": "「物置を除いて3階のすべての部屋」という除外の意味でexcludingを選ぶ。"}, {"stem": "Nobody on the committee objected to the plan ------- Mr. Hale, who asked for more time.", "choices": ["owing to", "even if", "in case", "other than"], "answer": 3, "explain": "nobody ... other than ～で「～以外は誰も…ない」。owing toは理由、even if・in caseは接続詞。"}]}, {"src": "Q121", "part": 5, "cat": "慣用表現", "point": "be動詞の後ろでto不定詞を続けられる形容詞を選ぶ（be willing to / be likely to / be eager to など）。", "items": [{"stem": "Several staff members are ------- to work extra shifts during the holiday season.", "choices": ["fond", "capable", "willing", "aware"], "answer": 2, "explain": "be willing to doで「進んで～する」。fondとcapableはof、awareはofやthat節と使う。"}, {"stem": "The delayed shipment is ------- to arrive by Thursday afternoon.", "choices": ["likely", "possible", "together", "apart"], "answer": 0, "explain": "be likely to doで「～しそうだ」。possibleは人や物を主語にしてto不定詞を続けられない。"}, {"stem": "New employees are often ------- to learn from experienced colleagues.", "choices": ["successful", "fond", "capable", "eager"], "answer": 3, "explain": "be eager to doで「～したがっている」。successfulはin、fond・capableはofと結びつく。"}]}, {"src": "Q122", "part": 5, "cat": "前置詞・接続詞", "point": "節を導いて「～したら（すぐに）」を表す接続詞（once / as soon as / after）を選ぶ。前置詞句は節を導けない。", "items": [{"stem": "Your membership card will be mailed to you ------- your application has been approved.", "choices": ["during", "once", "despite", "in order"], "answer": 1, "explain": "後ろに主語＋動詞が続くので接続詞once（いったん～したら）が正解。during・despiteは前置詞。"}, {"stem": "The new cafeteria will open to staff ------- the kitchen equipment is installed.", "choices": ["as soon as", "instead of", "according to", "such as"], "answer": 0, "explain": "節を導く接続詞as soon as（～するとすぐに）を選ぶ。他は前置詞句で節を続けられない。"}, {"stem": "------- the flights are confirmed, the travel agent will send you an itinerary.", "choices": ["Due to", "Prior to", "In spite of", "After"], "answer": 3, "explain": "後ろが節なので接続詞としても使えるAfterが正解。Due to・Prior to・In spite ofは名詞しか続かない。"}]}, {"src": "Q123", "part": 5, "cat": "品詞", "point": "be動詞と過去分詞（designed, packagedなど）の間には、過去分詞を修飾する副詞が入る。", "items": [{"stem": "The science museum's new wing is ------- designed for young children.", "choices": ["special", "specialty", "specially", "specialize"], "answer": 2, "explain": "is designedの間で過去分詞を修飾するので副詞specially（特別に）が入る。"}, {"stem": "All of our products are ------- packaged to prevent damage during shipping.", "choices": ["tight", "tightly", "tighten", "tightness"], "answer": 1, "explain": "are packagedの間に入り動詞を修飾する副詞tightly（しっかりと）を選ぶ。"}, {"stem": "The conference room is ------- equipped with video conferencing tools.", "choices": ["completion", "complete", "completes", "completely"], "answer": 3, "explain": "is equippedの間で過去分詞を修飾するのは副詞completely。be completely equipped withで「完備されている」。"}]}, {"src": "Q124", "part": 5, "cat": "語彙", "point": "長さや時間を短くした内容という文脈から、「簡潔な・短縮された」を表す形容詞を選ぶ。", "items": [{"stem": "Each presenter will give a ------- talk of no more than ten minutes.", "choices": ["vacant", "brief", "fragile", "lengthy"], "answer": 1, "explain": "「10分以内の話」なのでbrief（短い）が正解。lengthy（長い）は文意と逆。"}, {"stem": "The manager asked for a ------- list of the key findings instead of the full report.", "choices": ["concise", "crowded", "reluctant", "generous"], "answer": 0, "explain": "報告書全体ではなく要点をまとめた一覧なのでconcise（簡潔な）を選ぶ。"}, {"stem": "Because of the storm, the ceremony followed an ------- program that ended by noon.", "choices": ["anxious", "eventual", "adjacent", "abbreviated"], "answer": 3, "explain": "嵐のため正午までに終わる「短縮された」プログラムとなるabbreviatedが正解。"}]}, {"src": "Q125", "part": 5, "cat": "動詞の形", "point": "主語が「物」なので受動態、過去の発言・伝達の中で述べられた未来なのでwould be＋過去分詞を選ぶ。", "items": [{"stem": "The organizers stated that the prizes ------- at the closing ceremony.", "choices": ["award", "awarding", "would be awarded", "have awarded"], "answer": 2, "explain": "prizes（賞品）は「授与される」ので受動態。statedという過去の発言の中の未来なのでwould be awardedが正解。"}, {"stem": "The landlord mentioned that the elevator ------- over the weekend.", "choices": ["would be inspected", "inspecting", "inspects", "to inspect"], "answer": 0, "explain": "エレベーターは「点検される」側なので受動態、過去の発言内の予定なのでwould be inspectedを選ぶ。"}, {"stem": "Resid /* ---------- storage ---------- */
let KEY=null;   // 利用者ごとの保存先（ログイン時に決まる）
let DB={s:{},log:{},cat:{},qs:{},cfg:{levels:[],size:20,newPerDay:20,goal:30},profile:{}};
function save(){ if(!KEY) return; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

const DAY=864e5, MIN=6e4;
const IVL=[0,1,3,7,14,30,60]; // days per box
const dkey=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0');};
const today=()=>dkey(Date.now());
function st(w){ return DB.s[w.id] || null; }
function ensure(w){ return DB.s[w.id] ||= {box:0,due:0,ok:0,ng:0,seen:0}; }
function logAns(ok){ const d=DB.log[today()] ||= {n:0,ok:0}; d.n++; if(ok) d.ok++; addXP(ok?10:3); }

function grade(w, g){ // g: 0 again, 1 hard, 2 good
  const s=ensure(w), now=Date.now(); s.seen++;
  if(g===0){ s.box=0; s.due=now+10*MIN; s.ng++; }
  else if(g===1){ s.box=Math.max(1,s.box); s.due=now+Math.max(1,IVL[s.box]/2)*DAY; }
  else { s.box=Math.min(6,s.box+1); s.due=now+IVL[s.box]*DAY; s.ok++; }
  s.last=now; const d=DB.log[today()] ||= {n:0,ok:0}; d.c=(d.c||0)+1; addXP(2); save();
}
function quizResult(w, ok){
  const s=ensure(w), now=Date.now(); s.seen++;
  if(ok){ s.ok++; if(s.due<=now){ s.box=Math.min(6,s.box+1); s.due=now+IVL[s.box]*DAY; } }
  else { s.ng++; s.box=0; s.due=now+10*MIN; }
  s.last=now; logAns(ok); save();
}
function status(w){
  const s=st(w); if(!s||!s.seen) return 'new';
  if(s.box>=4) return 'master';
  if(s.ng>0 && s.box<=1) return 'weak';
  return 'learning';
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

const grpLabel=g=>/^\d+$/.test(g)?`Score ${g}`:g;
const LEVELS=[...new Set(WORDS.map(grp))].sort((a,b)=>(/^\d/.test(b)-/^\d/.test(a))||a.localeCompare(b,'ja',{numeric:true}));
function pool(){ const L=DB.cfg.levels.map(String); const P=L.length? WORDS.filter(w=>L.includes(grp(w))) : WORDS; return P.length?P:WORDS; }
function dueList(){ const now=Date.now(); return pool().filter(w=>{const s=st(w);return s&&s.seen&&s.due<=now;}).sort((a,b)=>st(a).due-st(b).due); }
function newToday(){ const t=today(); return pool().filter(w=>{const s=st(w); return s&&s.first===t;}).length; }
function newList(){ return pool().filter(w=>status(w)==='new'); }
function weakList(){ return pool().filter(w=>{const s=st(w);return s&&s.ng>0;}).sort((a,b)=>(st(b).ng-st(b).ok*.5)-(st(a).ng-st(a).ok*.5)); }
function posTags(w){ return (w.pos||[]).map(p=>`<span class="pos">${esc(p)}</span>`).join(''); }
function markWord(sentence, word){
  const base=word.split(' ')[0].replace(/e$/,'').replace(/y$/,'');
  const re=new RegExp('\\b('+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','i');
  return esc(sentence).replace(re,'<mark>$1</mark>');
}

/* ---------- motivation: XP, level, daily goal ---------- */
function addXP(n){ DB.xp=(DB.xp||0)+n; const d=DB.log[today()] ||= {n:0,ok:0}; d.xp=(d.xp||0)+n; }
function lvInfo(xp=DB.xp||0){ let lv=1, need=100, base=0; while(xp>=base+need){ base+=need; lv++; need=100+ (lv-1)*50; } return {lv, cur:xp-base, need}; }
function doneOn(k){ const d=DB.log[k]; return d? (d.n||0)+(d.c||0) : 0; }
function streakDays(){ let s=0; for(let i=0;i<1000;i++){ const k=dkey(Date.now()-i*DAY); if(doneOn(k)) s++; else if(i>0) break; } return s; }
function recentRate(){ // 直近の問題の正答率（qsのうち最近の解答）
  const qs=Object.values(DB.qs||{}).filter(q=>q.last).sort((a,b)=>b.last-a.last).slice(0,100);
  const all=Object.values(DB.log); const n=all.reduce((a,d)=>a+(d.n||0),0), ok=all.reduce((a,d)=>a+(d.ok||0),0);
  if(qs.length>=10){ const nn=qs.reduce((a,q)=>a+q.n,0), oo=qs.reduce((a,q)=>a+q.ok,0); return nn?Math.round(oo/nn*100):null; }
  return n?Math.round(ok/n*100):null;
}

function ring(pct,size,stroke,color,track,inner,grad){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${grad?`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>`:''}
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${grad?`url(#${gid})`:color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
  </svg><div class="in">${inner}</div></div>`;
}
function startCatTraining(cat){
  const B=bank().filter(q=>q.cat===cat);
  const items=weightedPick(B,DB.cfg.size,q=>{const s=DB.qs[q.qid]; return (q.src?1.5:1)*(s?(s.wrong?3:.5):1.2);}).map(b=>fromBank(b));
  startItems(items,cat+'を強化',{again:()=>startCatTraining(cat),follow:true});
}

function startCards(list,label){
  const s={xp0:DB.xp||0,q:list.slice(),i:0,flip:false,label,done:0,total:list.length,again:[]};

    $('#app').innerHTML=`<div class="stack">
      <div class="sess"><button class="btn ghost" id="quit">終了</button><div class="bar"><i style="width:${s.done/s.total*100}%"></i></div><span class="num small muted">${s.done}/${s.total}</span></div>

        ${s.flip?`
          <div class="meaning">${posTags(w)}${esc(w.meaning)}</div>
          ${w.ex?`<div class="ex"><div class="e">${markWord(w.ex,w.word)}</div><div class="j">${esc(w.exJa)}</div></div>`:''}
        `:`<div class="hint">タップして意味を表示</div>`}
      </div>
      ${s.flip?`<div class="grade">
        <button class="btn g-again" data-g="0">知らない<small>${nextLbl(0)}</small></button>
        <button class="btn g-hard" data-g="1">あやふや<small>${nextLbl(1)}</small></button>
        <button class="btn g-good" data-g="2">覚えた<small>${nextLbl(2)}</small></button>
      </div>`:`<button class="btn primary block" id="show">意味を見る</button>`}
    </div>`;
    $('#quit').onclick=()=>go(TAB);
    $('#say').onclick=e=>{e.stopPropagation();speak(w.word);};
    const flip=()=>{ if(!s.flip){ s.flip=true; s.render(); } };
    $('#fc').onclick=flip; if($('#show')) $('#show').onclick=flip;
    document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      const g=+b.dataset.g, x=ensure(w); if(!x.first) x.first=today();
      grade(w,g);
      if(g===0){ s.q.push(w); s.again.push(w); } else s.done++;
      s.i++; s.flip=false; s.render();
    });
  };
  SESSION=s; s.render(); window.scrollTo(0,0);
}

function pickForQuiz(n){
  // weight: weak 3, learning 2, new 1.5, master 1
  const W={weak:3,learning:2,new:1.5,master:1};
  return pool().map(w=>({w,k:Math.random()**(1/W[status(w)])})).sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.w);
}
function distract(w,field,n=3){
  const p0=(w.pos||[])[0];
  const same=shuffle(WORDS.filter(x=>x!==w && x[field]!==w[field] && (x.pos||[])[0]===p0));
  const other=shuffle(WORDS.filter(x=>x!==w && x[field]!==w[field]));
  const out=[]; for(const x of [...same,...other]){ if(!out.some(o=>o[field]===x[field])) out.push(x); if(out.length>=n) break; }
  return out;
}
/* ---------- Part 5 question bank & weak-point tracking ---------- */
const CATS=['品詞','動詞の形','前置詞・接続詞','代名詞・関係詞','語彙','比較・数量','慣用表現'];
function guessCat(ch){
  const a=ch.map(c=>c.toLowerCase());
  let p=0; while(p<a[0].length && a.every(c=>c[p]===a[0][p])) p++;
  return p>=4 ? '品詞' : '語彙';
}
// 類題 (drills) from 公式問題集: one bank item per original item
const DQ=[];
DRILLS.forEach(d=>(d.items||[]).forEach((it,i)=>DQ.push({qid:'d:'+d.src+':'+i, stem:it.stem, choices:it.choices, answer:it.answer, explain:it.explain, cat:CATS.includes(d.cat)?d.cat:'語彙', src:d.src, point:d.point})));
function wordQ(w){ return {qid:'w:'+w.id, stem:w.q.stem, choices:w.q.choices, answer:w.q.answer, explain:w.q.explain, cat:CATS.includes(w.q.cat)?w.q.cat:guessCat(w.q.choices), w}; }
function bank(){ return [...DQ, ...pool().filter(w=>w.q&&w.q.choices).map(wordQ)]; }
DB.cat=DB.cat||{}; DB.qs=DB.qs||{};
function catStat(c){ return DB.cat[c]||{n:0,ok:0}; }
function catWeak(c){ const s=catStat(c); return (s.n-s.ok+1)/(s.n+4); }   // smoothed error rate, 0.25 when unseen
function recordQ(item,ok){
  const c=DB.cat[item.cat] ||= {n:0,ok:0}; c.n++; if(ok) c.ok++;
  const q=DB.qs[item.qid] ||= {n:0,ok:0}; q.n++; if(ok) q.ok++; q.last=Date.now(); q.wrong=!ok;
  save();
}
function weightedPick(list,n,wf){
  return list.map(x=>({x,k:Math.random()**(1/Math.max(.01,wf(x)))})).sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.x);
}
function pickWeak(n){
  const B=bank();
  const wrongSrc=new Set(Object.entries(DB.qs).filter(([k,v])=>v.wrong&&k.startsWith('d:')).map(([k])=>k.split(':')[1]));
  const wrongCat=new Set(B.filter(q=>DB.qs[q.qid]?.wrong).map(q=>q.cat));
  return weightedPick(B,n,q=>{
    const s=DB.qs[q.qid];
    let wt=catWeak(q.cat)*4;
    if(q.src) wt+=1;                                      // 公式問題集ベースの類題を優先
    if(s?.wrong) wt+=3;                                   // missed last time → ask again
    if(q.src&&wrongSrc.has(q.src)&&!s) wt+=2.5;           // unseen sibling of a missed 類題
    if(wrongCat.has(q.cat)) wt+=.8;
    if(s&&s.ok&&!s.wrong&&Date.now()-s.last<DAY) wt*=.2;  // answered right today → rest
    if(q.w&&status(q.w)==='weak') wt+=1;
    return wt;
  });
}
function similarTo(item,exclude){
  const B=bank().filter(q=>q.qid!==item.qid&&!exclude.has(q.qid));
  const fresh=q=>!DB.qs[q.qid]?.ok;
  return (item.src&&shuffle(B.filter(q=>q.src===item.src&&fresh(q)))[0])
      || shuffle(B.filter(q=>q.cat===item.cat&&q.src&&fresh(q)))[0]
      || shuffle(B.filter(q=>q.cat===item.cat&&fresh(q)))[0] || null;
}

function makeQ(w,type){
  if(type==='mix') type=['p5','mean','rev'][Math.random()*3|0];
  if(type==='p5' && !(w.q&&w.q.choices)) type='mean';
  if(type==='p5') return fromBank(wordQ(w));
  if(type==='mean'){ const opts=shuffle([w,...distract(w,'meaning')]); return {w,type,choices:opts.map(o=>o.meaning),answer:opts.indexOf(w),en:false,opts}; }
  const opts=shuffle([w,...distract(w,'word')]); return {w,type,choices:opts.map(o=>o.word),answer:opts.indexOf(w),en:true,opts};
}
function fromBank(b,extra){
  const ord=shuffle([0,1,2,3]);
  return Object.assign({type:'p5',en:true,qid:b.qid,cat:b.cat,src:b.src,point:b.point,w:b.w,stem:b.stem,explain:b.explain,
    choices:ord.map(i=>b.choices[i]),answer:ord.indexOf(b.answer)},extra||{});
}
function startQuiz(type,list,label){
  list = list && list.length ? shuffle(list).slice(0,DB.cfg.size) : pickForQuiz(DB.cfg.size);
  const names={p5:'Part 5 形式',mean:'意味4択',rev:'英語を答える',mix:'ミックス'};
  startItems(list.map(w=>makeQ(w,type)),label||names[type],{again:()=>startQuiz(type)});
}
function startWeak(label){
  const items=pickWeak(DB.cfg.size).map(b=>fromBank(b));
  startItems(items,label||'弱点トレーニング',{again:()=>startWeak(label),follow:true});
}
function startDrills(filter,label){
  const B=DQ.filter(filter);
  const items=weightedPick(B,DB.cfg.size,q=>{const s=DB.qs[q.qid]; return s?(s.wrong?3:.6):1.5;}).map(b=>fromBank(b));
  startItems(items,label,{again:()=>startDrills(filter,label),follow:true});
}
function startItems(items,label,opt={}){

  const s={xp0:DB.xp||0,items,i:0,picked:null,results:[],label,opt,followUps:0,used:new Set(items.map(q=>q.qid).filter(Boolean))};

    if(q.type==='p5') prompt=`${tags}<div class="eyebrow">空所に入る最も適切な語を選んでください</div><div class="stem">${esc(q.stem).replace(/-{3,}/, `<span class="blank">${answered?esc(q.choices[q.answer]):'&nbsp;'}</span>`)}</div>`;
    else if(q.type==='mean') prompt=`<div class="eyebrow">正しい意味を選んでください</div><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="word">${esc(w.word)}</div><button class="icon-btn" id="say" aria-label="発音を聞く">${SPEAK_SVG}</button></div>`;
    else prompt=`<div class="eyebrow">この意味の英単語を選んでください</div><div class="meaning">${posTags(w)}${esc(w.meaning)}</div>`;
    const cls=i=>!answered?'':(i===q.answer?'right':(i===s.picked?'wrong':''));
    const nextQ=s.items[s.i+1];
    $('#app').innerHTML=`<div class="stack">
      <div class="sess"><button class="btn ghost" id="quit">終了</button><div class="bar"><i style="width:${s.i/s.items.length*100}%"></i></div><span class="num small muted">${s.i+1}/${s.items.length}</span></div>
      <div class="card stack pop" style="gap:14px">${prompt}</div>
      <div class="opts">${q.choices.map((c,i)=>`<button class="opt ${q.en?'en-opt':''} ${cls(i)}" data-i="${i}" ${answered?'disabled':''}><span class="bub">${answered&&(i===q.answer||i===s.picked)?(i===q.answer?'✓':'✕'):L[i]}</span><span class="tx">${esc(c)}</span></button>`).join('')}</div>
      ${answered?`<div class="explain pop">
        <div class="verdict ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　<span class="small muted" style="font-weight:400">正解は (${L[q.answer]}) ${esc(q.choices[q.answer])}</span></div>
        ${q.point?`<div class="small"><b>ポイント</b>　${esc(q.point)}</div>`:''}
        ${q.explain?`<div class="small">${esc(q.explain)}</div>`:''}
        ${w?`<div class="row" style="flex-wrap:nowrap;justify-content:space-between"><div><span class="en" style="font-weight:600;font-size:17px">${esc(w.word)}</span>　${posTags(w)}<span>${esc(w.meaning)}</span></div><button class="icon-btn" id="say2" aria-label="発音を聞く">${SPEAK_SVG}</button></div>`:''}
        ${w&&q.type!=='p5'&&w.ex?`<div class="ex"><div class="e">${markWord(w.ex,w.word)}</div><div class="j">${esc(w.exJa)}</div></div>`:''}
        ${q.opts&&!ok?`<div class="small muted">選んだ語：<span class="${q.type==='rev'?'en':''}">${esc(q.opts[s.picked].word)}</span> ＝ ${esc(q.opts[s.picked].meaning)}</div>`:''}
        ${!ok&&nextQ&&nextQ.follow&&nextQ.parent===q.qid?`<div class="small" style="color:var(--warn)">同じポイントの似た問題が次に出ます。</div>`:''}
      </div>
      <button class="btn primary block" id="next">${nextQ?'次の問題':'結果を見る'}</button>`:''}
    </div>`;
    $('#quit').onclick=()=>go(TAB);
    if($('#say')) $('#say').onclick=()=>speak(w.word);
    if($('#say2')) $('#say2').onclick=()=>speak(w.word);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(s.picked!==null) return;

        if(!good && s.followUps<5){
          const sim=similarTo(q,s.used);
          if(sim){ s.used.add(sim.qid); s.followUps++; s.items.splice(s.i+1,0,fromBank(sim,{follow:true,parent:q.qid})); }

  };
  SESSION=s; s.render(); window.scrollTo(0,0);
}
function finishQuiz(s){
  const n=s.results.length, ok=s.results.filter(r=>r.ok).length;
  const missQ=s.results.filter(r=>!r.ok).map(r=>r.q);
  const miss=[...new Map(missQ.filter(q=>q.w).map(q=>[q.w.id,q.w])).values()];
  const missCats={}; missQ.filter(q=>q.cat).forEach(q=>missCats[q.cat]=(missCats[q.cat]||0)+1);
  const rate=n?Math.round(ok/n*100):0;
  const msg= rate>=90?'この範囲はほぼ定着しています。':rate>=70?'あと一歩です。間違えたところを確認しましょう。':'間違えたポイントの似た問題で、もう一度練習しましょう。';
  $('#app').innerHTML=`<div class="stack pop">
    <div class="card stack result">
      <div class="eyebrow">${esc(s.label)}</div>
      <h2>${rate>=90?'Excellent!':rate>=70?'Great Job!':rate>=50?'Nice Try!':'Keep Going!'}</h2>
      <div class="burst">${ring(rate/100,150,13,'','var(--surface2)',`<span class="v" style="font-size:40px">${rate}<span style="font-size:16px">%</span></span><span class="l num">${ok} / ${n} 問正解</span>`,true)}</div>
      <span class="xp">${IC.star}+${(DB.xp||0)-s.xp0} XP</span>
      <div class="small muted">${msg}</div>
      ${doneOn(today())>=DB.cfg.goal?`<div class="small" style="color:var(--good);font-weight:700">今日の目標（${DB.cfg.goal}問）を達成しています</div>`:`<div class="small muted">今日の目標まで あと${DB.cfg.goal-doneOn(today())}問</div>`}
    </div>
    ${Object.keys(missCats).length?`<div class="card stack" style="gap:6px"><b>間違えたポイント</b>${Object.entries(missCats).sort((a,b)=>b[1]-a[1]).map(([c,k])=>`<div class="row" style="justify-content:space-between"><span>${esc(c)}</span><span class="num small" style="color:var(--bad)">${k}問</span></div>`).join('')}</div>`:''}
    ${missQ.length?`<button class="btn primary block" id="rw">間違えたポイントの似た問題を解く</button>`:''}
    ${miss.length?`<div class="card stack" style="gap:6px"><b>間違えた単語</b>${miss.map(w=>`<div><span class="en" style="font-weight:600">${esc(w.word)}</span>　<span class="muted small">${esc(w.meaning)}</span></div>`).join('')}</div>
    <button class="btn block" id="rc">間違えた単語をカードで確認</button>`:''}
    ${missQ.length?`<button class="btn block" id="rq">間違えた問題だけ解き直す</button>`:''}
    <button class="btn block" id="again">別の${DB.cfg.size}問を解く</button>
    <button class="btn block ghost" id="home">ホームへ</button>
  </div>`;
  if(missQ.length){
    $('#rw').onclick=()=>{
      const used=new Set(missQ.map(q=>q.qid)); const items=[];
      for(let r=0;r<3&&items.length<DB.cfg.size;r++) for(const q of missQ){ const sim=similarTo(q,used); if(sim){ used.add(sim.qid); items.push(fromBank(sim)); } }
      startItems(items.length?items:pickWeak(DB.cfg.size).map(b=>fromBank(b)),'似た問題で復習',{again:()=>startWeak(),follow:true});
    };
    $('#rq').onclick=()=>startItems(shuffle(missQ).map(q=>q.type==='p5'?fromBank(bank().find(b=>b.qid===q.qid)||q):makeQ(q.w,q.type)),'解き直し',s.opt);
  }

}
function weakCard(){
  const rows=CATS.map(c=>({c,...catStat(c)})).filter(r=>r.n>0);

  </div>`;
}

    p:{target:DB.profile.target||null,testDate:DB.profile.testDate||'',cur:DB.profile.cur??null,minutes:DB.profile.minutes||null},

const UKEY='toeic-drill-users', CURKEY='toeic-drill-current', LEGACY='toeic-drill-v1';
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };
const ssGet=k=>{ try{ return sessionStorage.getItem(k); }catch(e){ return null; } };
const ssSet=(k,v)=>{ try{ sessionStorage.setItem(k,v); }catch(e){} };
const ssDel=k=>{ try{ sessionStorage.removeItem(k); }catch(e){} };
function users(){ try{ return JSON.parse(lsGet(UKEY))||[]; }catch(e){ return []; } }
function saveUsers(u){ lsSet(UKEY,JSON.stringify(u)); }
const ukey=id=>'toeic-drill-u-'+id;
let ME=null;          // current user record
const AV_COLORS=['#3c6df0','#ff6a3d','#12a06a','#8b5cf6','#e8930c','#e5484d','#0ea5b7'];

async function hashPw(pw,salt){
  try{
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return 'p2:'+[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ // 古いブラウザ向けの簡易版
    let h=2166136261>>>0; const s=salt+':'+pw;
    for(let r=0;r<4000;r++) for(let i=0;i<s.length;i++){ h^=(s.charCodeAt(i)+r)&0xffff; h=Math.imul(h,16777619)>>>0; }
    return 'f1:'+h.toString(16);
  }
}
function initDB(raw){
  const d=raw||{};
  d.s=d.s||{}; d.log=d.log||{}; d.cat=d.cat||{}; d.qs=d.qs||{};
  d.cfg=Object.assign({levels:[],size:20,newPerDay:20,goal:30},d.cfg||{});
  d.profile=d.profile||{};
  return d;
}
function loginAs(u,remember){
  ME=u; KEY=ukey(u.id);
  let raw=null; try{ raw=JSON.parse(lsGet(KEY)); }catch(e){}
  DB=initDB(raw);
  ssSet(CURKEY,u.id); if(remember) lsSet(CURKEY,u.id); else lsDel(CURKEY);
  document.body.classList.remove('locked');
  TAB='home'; SESSION=null; render(); window.scrollTo(0,0);
}
function logout(){ save(); ME=null; ssDel(CURKEY); lsDel(CURKEY); DB=initDB(null); KEY=null; SESSION=null; renderLogin(); }

/* ---------- personalization ---------- */
const CUR_BANDS=['まだ受けたことがない','〜395点','400〜495点','500〜595点','600〜695点','700点以上'];
const TARGETS=[600,650,700,730,800,860];
const MINUTES=[10,20,30,60];
function daysLeft(){ const t=DB.profile.testDate; if(!t) return null; const d=Math.ceil((new Date(t+'T00:00:00')-new Date(dkey(Date.now())+'T00:00:00'))/DAY); return d>=0?d:null; }
function suggestPlan(p){
  const goal={10:20,20:30,30:50,60:100}[p.minutes]||30;
  let npd={10:10,20:20,30:30,60:50}[p.minutes]||20;
  const d=p.testDate?Math.ceil((new Date(p.testDate+'T00:00:00')-Date.now())/DAY):null;
  if(d&&d>0){ const left=WORDS.filter(w=>!(DB.s[w.id]&&DB.s[w.id].seen)).length; npd=Math.max(10,Math.min(50,Math.ceil(left/Math.max(1,d-7)/5)*5)); }
  return {goal,newPerDay:npd};
}
function personalMsg(done,left,weakest,due){
  const p=DB.profile, d=daysLeft();
  if(d!==null&&d<=14) return d===0?'<b>今日が本番。</b>新しいことより、苦手の見直しを軽めに。':`本番まで<b>あと${d}日</b>。新しい単語より、復習と弱点を優先しましょう。`;
  if(done===0) return due>20?`復習待ちが<b>${due}語</b>あります。まずは復習カードから。`:`今日はまだ0問。<b>まずは5問</b>から始めましょう。`;
  if(left>0) return `今日の目標まで<b>あと${left}問</b>。${weakest?`苦手な「${esc(weakest.c)}」も少しやると効果的です。`:'この調子です。'}`;
  return `<b>今日の目標を達成しました。</b>${p.target?`${p.target}点に向けて着実に進んでいます。`:'余裕があれば弱点を1セット。'}`;
}

  if($('#cancel')) $('#cancel').onclick=()=>renderLogin();
  $('#rf').onsubmit=async e=>{ e.preventDefault();
    const err=m=>{ const x=$('#err'); x.hidden=false; x.textContent=m; };
    const name=$('#rn').value.trim(), pw=$('#rp').value;
    if(!name) return err('ニックネームを入力してください。');
    if(users().some(u=>u.name===name)) return err('そのニックネームはこの端末ですでに使われています。別の名前にしてください。');
    if(pw.length<4) return err('パスワードは4文字以上にしてください。');
    if(pw!==$('#rp2').value) return err('確認用のパスワードが一致しません。');
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const u={id,name,salt,hash:await hashPw(pw,salt),color:AV_COLORS[users().length%AV_COLORS.length],created:Date.now()};
    let raw=null; if($('#adopt')?.checked){ try{ raw=JSON.parse(lsGet(LEGACY)); }catch(e){} }
    DB=initDB(raw);
    DB.profile={cur:f.cur===''?null:f.cur, target:f.target, testDate:$('#rd').value||'', minutes:f.minutes};
    Object.assign(DB.cfg, suggestPlan(DB.profile));
    lsSet(ukey(id),JSON.stringify(DB));
    if(raw) lsDel(LEGACY);
    saveUsers([...users(),u]);
    loginAs(u,false);
  };
}
function boot(){
  const U=users(), id=ssGet(CURKEY)||lsGet(CURKEY), u=U.find(x=>x.id===id);
  if(u) loginAs(u,!!lsGet(CURKEY)); else renderLogin();
}

document.addEventListener('keydown',e=>{
  if(!SESSION||e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(document.querySelector('.opt:not([disabled])')){ const i='abcd1234'.indexOf(k)%4; if('abcd1234'.includes(k)&&k) document.querySelectorAll('.opt')[i]?.click(); }
  else if($('#next')&&(k==='enter'||k===' ')){ e.preventDefault(); $('#next').click(); }
  else if($('#show')&&(k===' '||k==='enter')){ e.preventDefault(); $('#show').click(); }
  else if(document.querySelector('[data-g]')&&'123'.includes(k)&&k){ document.querySelector(`[data-g="${+k-1}"]`).click(); }
});
boot();
</script>
